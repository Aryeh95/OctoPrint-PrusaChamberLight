[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-PrusaChamberLight"
version = "0.4.1"
description = "Turn the Prusa CORE One chamber light on and off from OctoPrint, with optional brightness control through Prusa Connect"
authors = [
    {name = "Aryeh95"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = [
    "license"
]

requires-python = ">=3.7, <4"

# requests ships with OctoPrint
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_chamberlight",
    "octoprint_chamberlight.*"
]

[project.entry-points."octoprint.plugin"]
chamberlight = "octoprint_chamberlight"

[project.urls]
Homepage = "https://github.com/Aryeh95/OctoPrint-PrusaChamberLight"
